<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://unpkg.com https://cdn.jsdelivr.net;
    style-src 'self' https://unpkg.com 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self' https://en.wikipedia.org;
    font-src 'self';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
    object-src 'none';
  ">
  <title>The Many Cities of Delhi — Layers of Empires</title>

  <!-- Primary Meta Tags -->
  <meta name="title" content="The Many Cities of Delhi — Layers of Empires" />
  <meta name="description" content="An interactive Apple-style map exploring Delhi's historical monuments across 18 chronological kingdoms." />

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kaustubh-misra.github.io/delhi-monuments/" />
  <meta property="og:title" content="The Many Cities of Delhi — Layers of Empires" />
  <meta property="og:description" content="An interactive Apple-style map exploring Delhi's historical monuments across 18 chronological kingdoms." />
  <meta property="og:image" content="https://kaustubh-misra.github.io/delhi-monuments/preview.png" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://kaustubh-misra.github.io/delhi-monuments/" />
  <meta name="twitter:title" content="The Many Cities of Delhi — Layers of Empires" />
  <meta name="twitter:description" content="An interactive Apple-style map exploring Delhi's historical monuments across 18 chronological kingdoms." />
  <meta name="twitter:image" content="https://kaustubh-misra.github.io/delhi-monuments/preview.png" />

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Floating Sidebar Toggle Button -->
  <button id="sidebar-toggle" aria-label="Toggle Sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <span id="toggle-count" aria-hidden="true"></span>
  </button>

  <div id="sidebar">
    <!-- Main Title & Subtitle Header -->
    <div style="margin-bottom: 4px; padding-right: 30px;">
      <h1 style="font-family: 'JSL Ancient', Georgia, serif; font-size: 40px; color: #ffffff; font-weight: normal; margin: 0; line-height: 1.2;">
        The many cities of Delhi
      </h1>
      <h2 style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 24px; color: #f57b42; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px;">
        Layers of empires
      </h2>
    </div>

    <!-- Search Container with Dropdown Suggestions -->
    <div class="search-box-container">
      <input type="text" id="search-input" placeholder="Search monument (e.g. Ugrasen)..." autocomplete="off" />
      <div id="search-results" class="search-results-dropdown"></div>
    </div>

    <div class="btn-group">
      <button id="btn-all">All</button>
      <button id="btn-reset" class="btn-reset">Reset</button>
    </div>
    <div id="layer-list"></div>
  </div>

  <div id="map"></div>

  <!-- Chronological timeline strip -->
  <div id="timeline" aria-label="Dynasty timeline"></div>

  <!-- Onboarding toast -->
  <div id="onboard-toast" role="status">
    <span>Tap a dynasty on the timeline to add it to the map.</span>
    <button class="onboard-close" aria-label="Dismiss">&times;</button>
  </div>

  <!-- Google Maps Style Slide-Out Info Card -->
  <div id="info-card">
    <button id="card-close" class="close-card-btn" aria-label="Close">&times;</button>
    <div class="card-hero-image" id="card-hero">
      <img id="card-hero-img" alt="" />
      <div class="image-loader" id="card-loader">Loading image...</div>
    </div>
    <div class="card-content">
      <h2 id="card-title">Monument Name</h2>
      <div class="card-badges">
        <span id="card-kingdom-badge" class="badge-kingdom">Kingdom</span>
        <span id="card-era-badge" class="badge-era">Era</span>
      </div>
      <p id="card-desc" class="card-description"></p>

      <a id="card-directions-btn" target="_blank" rel="noopener noreferrer" class="directions-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Get Directions on Google Maps
      </a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"
          integrity="sha384-zPE55eyESN+FxCWGEnlNxGyAPJud6IZ6TtJmXb56OFRGhxZPN4akj9rjA3gw5Qqa"
          crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
